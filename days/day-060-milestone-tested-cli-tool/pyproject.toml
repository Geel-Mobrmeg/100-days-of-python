# tidy — the Phase 6 milestone, packaged.
#
# Everything a contributor needs to run is configured here, so nobody has
# to remember flags:
#
#     pytest          runs the suite WITH coverage, and fails under 90%
#     mypy tidy       strict, no Any
#     ruff check      the lint rules this course has used since Day 8

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tidy"
version = "1.0.0"
description = "Validate and summarise sales exports."
readme = "tidy/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []                      # zero. Standard library only.

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "mypy>=1.0", "ruff>=0.1"]

[project.scripts]
tidy = "tidy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tidy"]
artifacts = ["tidy/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=tidy --cov-report=term-missing --cov-fail-under=90 -q"

[tool.coverage.run]
branch = true
source = ["tidy"]
omit = [
    # The entry point is four lines and a `if __name__ == "__main__"`.
    # It is covered by test_the_installed_command_runs, which runs it as a
    # real subprocess — and a subprocess's lines are not counted here.
    # Omitting it is a decision, written down; the test is what makes the
    # decision safe.
    "tidy/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # A Protocol method's body is `...` and is never executed — that is
    # what a Protocol IS (Day 49). Counting it as a missed line would
    # punish the code for being well typed.
    "^\\s*\\.\\.\\.$",
]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "N", "UP", "C4", "SIM", "B"]
